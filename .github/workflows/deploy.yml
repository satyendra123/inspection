name: Build and Deploy Backend

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build obfuscated release
        run: npm run build:release

      - name: Archive dist
        run: tar -czf release.tar.gz -C dist .

      - name: Upload release bundle to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: release.tar.gz
          target: /tmp

      - name: Deploy release on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ secrets.SERVER_APP_DIR }}
          RESTART_COMMAND: ${{ secrets.SERVER_RESTART_COMMAND }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          envs: APP_DIR,RESTART_COMMAND
          script: |
            set -e
            APP_DIR="${APP_DIR:-/var/www/backend}"

            mkdir -p "$APP_DIR/dist"
            find "$APP_DIR/dist" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            tar -xzf /tmp/release.tar.gz -C "$APP_DIR/dist"
            rm -f /tmp/release.tar.gz

            cd "$APP_DIR/dist"
            npm install --omit=dev

            if [ -n "$RESTART_COMMAND" ]; then
              eval "$RESTART_COMMAND"
            elif command -v pm2 >/dev/null 2>&1; then
              pm2 restart mybackend || pm2 start app.js --name mybackend
            fi
